# ================================================================
# Factory Frenzy — de keuken (Overcooked-stijl)
# ================================================================
# Elk team runt een eigen keuken en moet bestellingen (gerechten) serveren voor het de tijd om is.
# Je draagt maar één ding tegelijk, dus het team moet het werk verdelen:
#   krat      -> geeft eindeloos een ingrediënt
#   snijplank -> zet er een ingrediënt op en klik herhaaldelijk met een lege hand om te snijden
#   pot/pan   -> stop de gesneden ingrediënten erin; het kookt vanzelf en VERBRANDT als je het te lang laat staan
#   aanrecht  -> tafel én plek om een bord samen te stellen (bord + onderdelen = gerecht)
#   bordenrek -> schone borden; wasbak -> vieze borden worden schoongemaakt (klikken met een lege hand)
#   luik      -> serveer het gerecht; het bord komt een poos later vies terug
#   prullenbak-> gooi alles weg (een bord komt dan vies terug)
#
# Setup:
#   /factory world
#   /factory factory add        sta op het beginpunt van de keuken van een team (één per team)
#   /factory info | validate    controleert of elk gerecht te maken is
#   /factory start [dry] | stop | factory list | factory clear | reload
# Test-arena (8 keukens):  /kmctest factory_frenzy
# ================================================================

config-version: 2

start-flow:
  introduction: true
  flyover: true
  tutorial: true
  countdown: true
start-sequence:
  intro-seconds: 3
  intro-subtitle: "Kook, serveer, was af — samen"
  flyover-radius: 30
  tutorial-seconds: 8
  countdown-seconds: 5

game:
  duration-seconds: 420
  final-countdown-seconds: 30

orders:
  open: 3                 # bestellingen tegelijk
  time-scale: 1.0         # 1.5 = alle bestellingen krijgen anderhalf keer zoveel tijd
  tip-percent: 50         # extra beloning als je snel serveert (bij 100% resterende tijd)
  combo-percent: 10       # per gerecht achter elkaar zonder verlopen bestelling, max 5 stappen

rules:
  chop-clicks: 5          # klikken om te snijden
  wash-clicks: 4          # klikken om een bord schoon te maken
  burn-seconds: 10        # zoveel tijd na "klaar" voor het verbrandt
  start-plates: 4         # schone borden bij de start
  dirty-delay-seconds: 8  # zo lang duurt het voor een geserveerd bord vies terug is

# Items. material = hoe het eruit ziet in je hand.
items:
  tomato:          { name: "Tomaat",          material: APPLE }
  chopped_tomato:  { name: "Gesneden tomaat", material: BEETROOT }
  onion:           { name: "Ui",              material: POTATO }
  chopped_onion:   { name: "Gesneden ui",     material: BAKED_POTATO }
  lettuce:         { name: "Sla",             material: KELP }
  chopped_lettuce: { name: "Gesneden sla",    material: DRIED_KELP }
  meat:            { name: "Gehakt",          material: BEEF }
  patty:           { name: "Burgerpatty",     material: COOKED_BEEF }
  bun:             { name: "Broodje",         material: BREAD }
  tomato_soup:     { name: "Tomatensoep",     material: BEETROOT_SOUP }
  onion_soup:      { name: "Uiensoep",        material: MUSHROOM_STEW }
  plate:           { name: "Bord",            material: BOWL }
  dirty_plate:     { name: "Vies bord",       material: BRICK }

# Wat je kunt snijden: ruw -> gesneden.
chopping:
  tomato: chopped_tomato
  onion: chopped_onion
  lettuce: chopped_lettuce

# Koken in een pot of pan. on-plate: true = je haalt het eruit met een bord (soep); anders met je hand (patty).
cooking:
  - { station: pot, in: { chopped_tomato: 3 }, out: tomato_soup, seconds: 14, on-plate: true }
  - { station: pot, in: { chopped_onion: 3 },  out: onion_soup,  seconds: 14, on-plate: true }
  - { station: pan, in: { meat: 1 },           out: patty,       seconds: 9 }

# Gerechten. parts = op een bord samen te stellen op een aanrecht; een gerecht zonder parts komt uit een pot (zie cooking).
# seconds = tijd die de bestelling duurt; unlock-after = na zoveel geserveerde gerechten verschijnt het; weight = kans.
dishes:
  tomato_soup: { name: "Tomatensoep", material: BEETROOT_SOUP,  reward: 100, seconds: 95 }
  onion_soup:  { name: "Uiensoep",    material: MUSHROOM_STEW,  reward: 100, seconds: 95 }
  salad:       { name: "Salade",      material: RABBIT_STEW,    reward: 90,  seconds: 80, parts: [chopped_tomato, chopped_lettuce] }
  burger:      { name: "Burger",      material: PUMPKIN_PIE,    reward: 150, seconds: 110, unlock-after: 2, parts: [bun, patty, chopped_lettuce] }

# Blokken van de stations (optioneel; standaard zoals hieronder).
blocks:
  crate: BARREL
  board: OAK_PLANKS
  pot: CAULDRON
  pan: SMOKER
  counter: QUARTZ_BLOCK
  sink: WATER_CAULDRON
  rack: WHITE_CONCRETE
  serve: GOLD_BLOCK
  trash: COMPOSTER

# Posities zijn [oost, omhoog, zuid] vanaf het beginpunt van de keuken. Je staat aan de zuidkant (spawn) en werkt noordwaarts.
layout:
  stations:
    - { kind: CRATE,   id: crate_tomato,  item: tomato,  name: "Tomaten", at: [-4, 0, -4] }
    - { kind: CRATE,   id: crate_onion,   item: onion,   name: "Uien",    at: [-2, 0, -4] }
    - { kind: CRATE,   id: crate_lettuce, item: lettuce, name: "Sla",     at: [0, 0, -4] }
    - { kind: CRATE,   id: crate_meat,    item: meat,    name: "Gehakt",  at: [2, 0, -4] }
    - { kind: CRATE,   id: crate_bun,     item: bun,     name: "Broodjes",at: [4, 0, -4] }
    - { kind: BOARD,   id: board1, name: "Snijplank", at: [-4, 0, -2] }
    - { kind: BOARD,   id: board2, name: "Snijplank", at: [-2, 0, -2] }
    - { kind: BOARD,   id: board3, name: "Snijplank", at: [0, 0, -2] }
    - { kind: POT,     id: pot1, item: pot, name: "Pot", at: [2, 0, -2] }
    - { kind: POT,     id: pot2, item: pot, name: "Pot", at: [3, 0, -2] }
    - { kind: POT,     id: pan1, item: pan, name: "Pan", at: [4, 0, -2] }
    - { kind: COUNTER, id: counter1, name: "Aanrecht", at: [-4, 0, 1] }
    - { kind: COUNTER, id: counter2, name: "Aanrecht", at: [-2, 0, 1] }
    - { kind: COUNTER, id: counter3, name: "Aanrecht", at: [0, 0, 1] }
    - { kind: COUNTER, id: counter4, name: "Aanrecht", at: [2, 0, 1] }
    - { kind: RACK,    id: rack,  name: "Bordenrek", at: [4, 0, 1] }
    - { kind: SERVE,   id: serve, name: "SERVEREN", at: [-4, 0, 3] }
    - { kind: TRASH,   id: trash, name: "Prullenbak", at: [-2, 0, 3] }
    - { kind: SINK,    id: sink,  name: "Afwas", at: [4, 0, 3] }
  board: [0, 0, -6]       # waar het bord met bestellingen hangt
  spawn: [0, 0, 5]

points:
  team-placement: true

arena:
  world: ""
