# ================================================================
# Formula MC — boat racing on ice
# ================================================================
# Circuits are built by hand and registered with /fmc (see /fmc help):
#   /fmc create <id> [name]   → new circuit (becomes the selected one)
#   /fmc spawn add            → add a grid slot where you stand (yaw = the way the boat faces)
#   /fmc pos1 / pos2          → select a gate (stand inside it)
#   /fmc line                 → the selected gate becomes the START/FINISH line
#   /fmc cp add               → the selected gate becomes the next checkpoint (fixed order)
#   /fmc reset                → safe reset location for stuck racers
#   /fmc laps <n>             → number of laps
# Everything below is tuning; circuits themselves are stored under "circuits:".
# ================================================================

# Which circuit the next race uses ("" = a random ready circuit)
selected: ""

game:
  # Hard limit for a race (seconds). 0 = no limit.
  max-duration-seconds: 900
  # A lap faster than this does not count (anti shortcut / double crossing).
  min-lap-seconds: 4
  # More than this many blocks between two position polls = a teleport: no checkpoint credit.
  max-teleport-step: 30
  # Seconds without moving before a racer is put back on the track.
  stuck-seconds: 8
  # How long (seconds) after the first finisher the others still have to finish. 0 = wait for everyone.
  finish-grace-seconds: 60

boat:
  # OAK, BIRCH, SPRUCE, JUNGLE, ACACIA, DARK_OAK, CHERRY, MANGROVE, PALE_OAK
  type: OAK
  # Let boats hop up 1-block steps (ramps) without losing speed.
  step-assist: true
  # Boats drive on land/ice too, not only in water.
  work-on-land: true

# Other racers only show up when they are this close (blocks).
visibility:
  enabled: true
  radius: 10

# Qualifying: everybody drives one timed lap first (no collisions); the fastest starts on pole.
qualifying:
  enabled: true
  # Maximum duration of the qualifying session (seconds). Slowpokes start at the back.
  max-seconds: 180
  # Several timed laps: the fastest one counts. 0 = drive until the time is up; N = park after N laps.
  max-laps: 0
  # The remaining time is announced in chat when it drops to these many seconds.
  announce-at: [120, 60, 30, 10]
  # Countdown (seconds) between the qualifying results and the race start.
  countdown-seconds: 5

# Track weather, chosen per race. weather.forced: auto | clear | rain | storm | night (/fmc weather).
# Rain/storm make the track slower ("drag" = extra speed loss per tick, ~1% is noticeable).
weather:
  enabled: true
  forced: auto
  chance:
    CLEAR: 50
    RAIN: 25
    STORM: 10
    NIGHT: 15
  drag:
    RAIN: 0.006
    STORM: 0.012

# Boost pads: gates added with /fmc pad add, plus optionally every block of this material the boat
# drives over (empty = off), e.g. GOLD_BLOCK.
boost:
  pad-material: ""
  pad-seconds: 1.5
  turbo-seconds: 3.0
  # Speed (blocks/tick) while boosting. A boat on ice does about 0.5 to 0.7.
  min-speed: 0.55
  max-speed: 1.1

# Item boxes (/fmc box add) give power-ups: TURBO, SHIELD, BLIND, STUN. Right-click to use.
powerups:
  enabled: true
  # Hotbar slot (0-8) of the held power-up.
  slot: 4
  box-respawn-seconds: 6
  shield-seconds: 10.0
  # Blind / stun duration for the racer who is hit.
  hit-seconds: 3.0

points:
  # Placement points per finishing position (like Ace Race): first, minus step per place, never below min.
  # Racers that did not finish get dnf. Each racer's points count for his team.
  placement:
    first: 320
    step: 10
    min: 0
    dnf: 0
  # Extra for every member of a team, from the average finishing position of its racers.
  team-avg-placement:
    1: 20
    2: 15
    3: 10
  # Awarded to whoever sets the fastest lap of the race.
  fastest-lap-bonus: 25
  # Pole position (fastest qualifying lap).
  pole-bonus: 10
  # Points for each completed lap.
  per-lap: 0

# Start presentation (same keys as the other games)
start-flow:
  introduction: true
  flyover: true
  tutorial: true
  countdown: true
start-sequence:
  intro-seconds: 3
  intro-subtitle: "Race over het ijs — eerste over de streep wint"
  flyover-radius: 30
  tutorial-seconds: 6
  countdown-seconds: 5

# Circuits (managed by /fmc)
circuits: {}
