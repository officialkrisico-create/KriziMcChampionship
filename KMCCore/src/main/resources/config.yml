      color: GREEN
      chat-color: "&a"
      tag-color: "GREEN"

    blauwe_bavianen:
      display-name: "Blauwe Bavianen"
      color: BLUE
      chat-color: "&9"
      tag-color: "BLUE"

    paarse_palingen:
