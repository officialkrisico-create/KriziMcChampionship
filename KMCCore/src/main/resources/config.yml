# -----------------------------------------------------------------------
# Points
# -----------------------------------------------------------------------
# All point rewards (kills, placement, bonuses) are configured in
# plugins/KMCCore/points.yml — see that file for details.

# -----------------------------------------------------------------------
# Easter-egg lobby NPCs
# -----------------------------------------------------------------------
# Spawn as many as you like with /kmclobbynpc spawn easter_egg — none have
# a floating name (tuck them away around the lobby). Each NPC gets a FIXED
# line from the list below (the 1st spawned NPC always says line 1, the
# 2nd always line 2, etc. — wraps around if you spawn more NPCs than lines).
# Players get credit the first time they find each one ("X/Y gevonden") and
# unlock the "Easter Egg Hunter" achievement once they've found them all.
easter-egg-npc:
  lines:
    - "&7\"Heb je al geprobeerd het uit en weer aan te zetten?\""
    - "&7\"Ik heb ooit 500 lucky blocks geopend. Vraag niet wat erin zat.\""
    - "&7\"De ronde-multiplier is eigenlijk gewoon een schattingsfout van de ontwikkelaar.\""
    - "&7\"Psst... niemand leest deze tekst, behalve jij nu.\""
    - "&7\"Fun fact: ik ben gewoon een dorpeling met een identiteitscrisis.\""


# -----------------------------------------------------------------------
# Scoreboard (sidebar)
# -----------------------------------------------------------------------
scoreboard:
  enabled: true
  update-interval: 20  # ticks (20 = 1 second)
  title: "&6&lKMC &e&lTournament"

# -----------------------------------------------------------------------
# Tablist
# -----------------------------------------------------------------------
tablist:
  header: "\n&6&lKrizi Minecraft Championship\n&7Round: &e{round} &8| &7Multiplier: &e{multiplier}x\n"
  footer: "\n&7Team: {team_color}{team_name}\n"

# -----------------------------------------------------------------------
# Announcements
# -----------------------------------------------------------------------
announcements:
  game-start:
    title: "&6&lGame Start!"
    subtitle: "&e{game_name}"
    sound: ENTITY_ENDER_DRAGON_GROWL

  game-end:
    title: "&6&lGame Over!"
    subtitle: "&e{winner} wins!"
    sound: UI_TOAST_CHALLENGE_COMPLETE

  round-start:
    title: "&6&lRound {round} Started!"
    subtitle: "&7Multiplier: &e{multiplier}x"
    sound: BLOCK_NOTE_BLOCK_PLING

  tournament-start:
    title: "&6&lKMC Tournament Started!"
    subtitle: "&eMay the best team win!"
    sound: ENTITY_LIGHTNING_BOLT_THUNDER

  vote-start:
    title: "&6&lVote for the next game!"
    subtitle: "&7Type the number in chat"
    sound: BLOCK_NOTE_BLOCK_CHIME

# ----------------------------------------------------------------------
# Commentary — korte aankondiging (titel + chat, in de taal van elke speler)
# bij grote momenten: kill-streaks, laatste overlevende, comebacks, boss-kills...
# De teksten staan in lang/<taal>.yml onder "commentary:".
# ----------------------------------------------------------------------
commentary:
  enabled: true
  # Minimale tijd tussen twee aankondigingen (zodat het niet vol loopt)
  global-cooldown-seconds: 6
  # Zelfde speler + zelfde soort moment: pas na zoveel seconden opnieuw
  per-player-cooldown-seconds: 45
  # Games die al hun eigen chat-melding voor het moment sturen (alleen de titel wordt dan getoond)
  skip-chat-games:
    - tnt_tag

# Flyovers / camera-routes: spectate een onzichtbare camera die client-side wordt geinterpoleerd (replay-mod gevoel).
# Zet op false om terug te vallen op losse teleports per tick.
cinematic:
  smooth-camera: true

# ── End of tournament (podium → awards → credits → fan favorite → feedback → books → reset) ──
end-sequence:
  fan-favorite-seconds: 20
  feedback-seconds: 15

awards-ceremony:
  enabled: true
  seconds-per-award: 7

credits:
  enabled: true
  seconds-per-card: 5
  thanks:
    - "&6&lBedankt voor het spelen!"
    - "&7Tot het volgende KMC-event!"

# "This season" in /kmcseason = the last N editions.
season:
  editions: 4

# -----------------------------------------------------------------------
# Presentation (wave 3) — everything defaults to on; these are the knobs
# -----------------------------------------------------------------------
# tablist.layout: mcc (team rows with live game points) or classic.
# tablist.presented-by: line under the title in the MCC header ("" = none).
# tablist.points-icon: symbol after the points of a team.
chat-gate:
  enabled: true            # mute chat (also for OP) during explanations and ceremonies

presentation:
  leaderboard-animation: true   # teams rise/fall with arrows after a game

cams:
  kill-cam:
    enabled: true
    seconds: 4
  finish-cam:
    enabled: true
    seconds: 4

gg:
  enabled: true
  window-seconds: 45

consolation:
  enabled: true            # last-place ritual (needs 3+ teams)
  seconds: 12

presenter:
  enabled: true

team-jingles:
  enabled: true
  # Per team: team-jingles.<id>.instrument / notes (0-24 semitones) / speed (ticks between notes)

# -----------------------------------------------------------------------
# Lobby games (wave 4): /ttt, /darts, /lobbygames — no tournament points
# -----------------------------------------------------------------------
lobby-games:
  enabled: true
  darts:
    per-turn: 5
    any-target-block: true   # every Target block in the lobby is a dartboard
  fishing:
    enabled: true

# -----------------------------------------------------------------------
# Platform (wave 5)
# -----------------------------------------------------------------------
# Live data for stream overlays. OFF by default. Binds to localhost; to use it from another machine set
# bind to 0.0.0.0 AND a token (then open /overlay?token=<token> in OBS as a browser source).
live-api:
  enabled: false
  port: 8765
  bind: "127.0.0.1"
  token: ""

# Clip markers: timecodes of notable moments, written to clip-markers.csv (/clip start = stream went live).
clips:
  enabled: true

# Nudges teleports that would put a player inside blocks; /kmcaudit shows what was corrected.
safe-teleport:
  enabled: true
  max-lift: 12
  void-check-depth: 40

# Lobby anti-grief (frames, armor stands, buckets, fire, containers, pearls). kmc.lobby.build is exempt.
anti-grief:
  enabled: true
  block-containers: true
  block-ender-pearls: true

# Spectators get a teleport compass / follow mode / leader tracker in every game.
spectator-kit:
  enabled: true

# Event storyline: round chapters and a recap after each game.
# Custom chapter per round, e.g.:  story.chapters.2.nl: "..." / story.chapters.2.en: "..."
story:
  enabled: true
  recap-delay-ticks: 240
  max-lines: 2
  close-gap: 40

# Team banners: override per team, e.g.  emblems.rood.base: RED / pattern: cross / color: WHITE
emblems: {}
