# ============================================================
#   KMC Core - Main Configuration
#   Krizi Minecraft Championship
# ============================================================

# Plugin settings
settings:
  debug: false
  language: nl  # nl = Dutch, en = English (future)
  prefix: "&6[&eKMC&6] &r"

  # Achievement system selector.
  # v1 = legacy AchievementManager (KMCCore SQLite, synchronous)
  # v2 = AchievementService (kmc-stats, async, YAML-driven — requires KMCCoreV2)
  # When set to v2, the V1 AchievementManager is not initialised and
  # no V1 achievement data is written. Run a DB migration before switching.
  achievement-system: v1

# -----------------------------------------------------------------------
# Arena
# -----------------------------------------------------------------------
arena:
  # Global lobby/waiting room location
  # Set with: /kmcarena setlobby
  lobby: null

# -----------------------------------------------------------------------
# Automation
# -----------------------------------------------------------------------
automation:
  # Seconds of lobby time between games (countdown bossbar)
  intermission-seconds: 30

  # Seconds between vote closing and game actually starting
  prestart-seconds: 10

  # How many games are played per round before the multiplier goes up
  games-per-round: 3

  # Seconds between repetitions of the same game (when repetitions > 1)
  # Used for brief intermission / schematic reset time
  repetition-intermission-seconds: 20

# -----------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------
database:
  # Options: yaml, sqlite
  type: sqlite
  # Only used if type is sqlite
  file: kmccore.db

# -----------------------------------------------------------------------
# Tournament settings
# -----------------------------------------------------------------------
tournament:
  name: "Krizi Minecraft Championship"
  total-rounds: 8
  current-round: 1
  active: false

  # Multiplier per round (round number -> multiplier)
  # Round 1 = 1x, Round 2 = 1.5x, Round 3 = 2x, etc.
  multipliers:
    1: 1.0
    2: 1.5
    3: 2.0
    4: 2.5
    5: 3.0
    6: 3.5
    7: 4.0
    8: 5.0

# -----------------------------------------------------------------------
# Golden Hour
# -----------------------------------------------------------------------
# One random round per tournament (picked fresh on every /kmctournament
# start, never announced in advance) gets a boosted multiplier on EVERY
# point award that round — including kills, which are normally flat.
golden-hour:
  enabled: true
  multiplier: 2.0

# -----------------------------------------------------------------------
# Comeback bonus
# -----------------------------------------------------------------------
# Gives the current last-place team a boost on every point award (kills,
# placements, team placements) once a real gap has formed — keeps a
# runaway tournament from feeling decided halfway through.
comeback-bonus:
  enabled: true
  # Boost multiplier applied to the award (1.25 = +25%).
  multiplier: 1.25
  # Only kicks in once the leader is at least this many points ahead of
  # last place — avoids boosting during the early, still-tied rounds.
  min-gap: 100



# -----------------------------------------------------------------------
# Teams
# -----------------------------------------------------------------------
teams:
  max-players-per-team: 4
  # Team chat prefix visible in chat
  chat-prefix-format: "&8[&r{team_color}{team_name}&8] &r{player_name}&7: {message}"

  # Pre-defined teams (can be edited, names must stay unique)
  list:
    rode_ratten:
      display-name: "Rode Ratten"
      color: RED
      chat-color: "&c"
      # Chat code for nametag (used in scoreboard teams)
      tag-color: "RED"

    oranje_otters:
      display-name: "Oranje Otters"
      color: GOLD
      chat-color: "&6"
      tag-color: "GOLD"

    gele_gnoes:
      display-name: "Gele Gnoes"
      color: YELLOW
      chat-color: "&e"
      tag-color: "YELLOW"

    groene_goudvissen:
      display-name: "Groene Goudvissen"
      color: GREEN
      chat-color: "&a"
      tag-color: "GREEN"

    blauwe_bavianen:
      display-name: "Blauwe Bavianen"
      color: BLUE
      chat-color: "&9"
      tag-color: "BLUE"

    paarse_palingen:
      display-name: "Paarse Palingen"
      color: DARK_PURPLE
      chat-color: "&5"
      tag-color: "DARK_PURPLE"

    roze_rendieren:
      display-name: "Roze Rendieren"
      color: LIGHT_PURPLE
      chat-color: "&d"
      tag-color: "LIGHT_PURPLE"

    witte_wespen:
      display-name: "Witte Wespen"
      color: WHITE
      chat-color: "&f"
      tag-color: "WHITE"

# -----------------------------------------------------------------------
# Games
# -----------------------------------------------------------------------
games:
  # Minimum rounds before same game can repeat
  repeat-cooldown: 2

  # Enable voting system (players vote for next game)
  voting-enabled: true
  # Voting duration in seconds
  voting-duration: 30
  # Number of options shown in vote
  voting-options: 3

  # Available game pool
  list:
    team_skywars:
      display-name: "Team Skywars"
      icon: BOW
      min-players: 2
      schematic: team_skywars.schem
      repetitions: 1   # how many times this game plays back-to-back per round

    tgttos:
      display-name: "TGTTOS"
      icon: MAGENTA_GLAZED_TERRACOTTA
      min-players: 2
      repetitions: 1

    the_bridge:
      display-name: "The Bridge"
      icon: WHITE_WOOL
      min-players: 2
      repetitions: 1

    survival_games:
      display-name: "Survival Games"
      icon: CARROT
      min-players: 2
      repetitions: 1

    quake_craft:
      display-name: "Quake Craft"
      icon: WOODEN_HOE
      min-players: 2
      repetitions: 1

    mob_mayhem:
      display-name: "Mob Mayhem"
      icon: ZOMBIE_HEAD
      min-players: 2
      repetitions: 1

    adventure_escape:
      display-name: "Adventure Escape"
      icon: LEATHER_BOOTS
      min-players: 1
      repetitions: 1

    parkour_warrior:
      display-name: "Parkour Warrior"
      icon: FEATHER
      min-players: 1
      repetitions: 1

    spleef_teams:
      display-name: "Spleef Teams"
      icon: WOODEN_SHOVEL
      min-players: 2
      repetitions: 1

    bingo_teams:
      display-name: "Bingo Teams"
      icon: PAPER
      min-players: 2
      repetitions: 1

    elytra_endrium:
      display-name: "Elytra Endrium"
      icon: ELYTRA
      min-players: 2
      repetitions: 1

    tnt_tag:
      display-name: "TNT TAG"
      icon: TNT
      min-players: 2
      repetitions: 1

    lucky_block:
      display-name: "LUCKY BLOCK"
      icon: SPONGE
      min-players: 2
      repetitions: 1

    block_party:
      display-name: "Block Party"
      icon: RED_CONCRETE
      min-players: 2
      repetitions: 1

    speed_build:
      display-name: "Speed Build"
      icon: BRICKS
      min-players: 1
      repetitions: 1

# -----------------------------------------------------------------------
# Points
# -----------------------------------------------------------------------
# All point rewards (kills, placement, bonuses) are configured in
# plugins/KMCCore/points.yml — see that file for details.

# -----------------------------------------------------------------------
# Easter-egg lobby NPCs
# -----------------------------------------------------------------------
# Spawn as many as you like with /kmclobbynpc spawn easter_egg — none have
# a floating name (tuck them away around the lobby). Each NPC gets a FIXED
# line from the list below (the 1st spawned NPC always says line 1, the
# 2nd always line 2, etc. — wraps around if you spawn more NPCs than lines).
# Players get credit the first time they find each one ("X/Y gevonden") and
# unlock the "Easter Egg Hunter" achievement once they've found them all.
easter-egg-npc:
  lines:
    - "&7\"Heb je al geprobeerd het uit en weer aan te zetten?\""
    - "&7\"Ik heb ooit 500 lucky blocks geopend. Vraag niet wat erin zat.\""
    - "&7\"De ronde-multiplier is eigenlijk gewoon een schattingsfout van de ontwikkelaar.\""
    - "&7\"Psst... niemand leest deze tekst, behalve jij nu.\""
    - "&7\"Fun fact: ik ben gewoon een dorpeling met een identiteitscrisis.\""


# -----------------------------------------------------------------------
# Scoreboard (sidebar)
# -----------------------------------------------------------------------
scoreboard:
  enabled: true
  update-interval: 20  # ticks (20 = 1 second)
  title: "&6&lKMC &e&lTournament"

# -----------------------------------------------------------------------
# Tablist
# -----------------------------------------------------------------------
tablist:
  header: "\n&6&lKrizi Minecraft Championship\n&7Round: &e{round} &8| &7Multiplier: &e{multiplier}x\n"
  footer: "\n&7Team: {team_color}{team_name}\n"

# -----------------------------------------------------------------------
# Announcements
# -----------------------------------------------------------------------
announcements:
  game-start:
    title: "&6&lGame Start!"
    subtitle: "&e{game_name}"
    sound: ENTITY_ENDER_DRAGON_GROWL

  game-end:
    title: "&6&lGame Over!"
    subtitle: "&e{winner} wins!"
    sound: UI_TOAST_CHALLENGE_COMPLETE

  round-start:
    title: "&6&lRound {round} Started!"
    subtitle: "&7Multiplier: &e{multiplier}x"
    sound: BLOCK_NOTE_BLOCK_PLING

  tournament-start:
    title: "&6&lKMC Tournament Started!"
    subtitle: "&eMay the best team win!"
    sound: ENTITY_LIGHTNING_BOLT_THUNDER

  vote-start:
    title: "&6&lVote for the next game!"
    subtitle: "&7Type the number in chat"
    sound: BLOCK_NOTE_BLOCK_CHIME

# ----------------------------------------------------------------------
# Commentary — korte aankondiging (titel + chat, in de taal van elke speler)
# bij grote momenten: kill-streaks, laatste overlevende, comebacks, boss-kills...
# De teksten staan in lang/<taal>.yml onder "commentary:".
# ----------------------------------------------------------------------
commentary:
  enabled: true
  # Minimale tijd tussen twee aankondigingen (zodat het niet vol loopt)
  global-cooldown-seconds: 6
  # Zelfde speler + zelfde soort moment: pas na zoveel seconden opnieuw
  per-player-cooldown-seconds: 45
  # Games die al hun eigen chat-melding voor het moment sturen (alleen de titel wordt dan getoond)
  skip-chat-games:
    - tnt_tag
