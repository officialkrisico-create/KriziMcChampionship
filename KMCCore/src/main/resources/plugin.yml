name: KMCCore
version: '${project.version}'
main: nl.kmc.kmccore.KMCCore
api-version: '1.21'
description: Core plugin for the Krizi Minecraft Championship
authors: [ KMC ]

softdepend:
  - Citizens
  - WorldEdit
  - FastAsyncWorldEdit
  - FancyNpcs

commands:
  kmcteam:
    description: Manage KMC teams
    usage: /kmcteam <add|remove|list|info|chat> [player] [team]
    permission: kmc.team

  kmcstats:
    description: View player statistics
    usage: /kmcstats [player]
    permission: kmc.stats

  kmctournament:
    description: Manage the KMC tournament
    usage: /kmctournament <start|stop|end|status|reset|hardreset>
    permission: kmc.tournament.admin

  kmcgame:
    description: Control the current game
    usage: /kmcgame <start|stop|skip|forceskip|next|vote|list|set> [game]
    permission: kmc.game.admin

  kmclb:
    description: View leaderboards
    usage: /kmclb <teams|players> [page]
    permission: kmc.leaderboard

  kmcnpc:
    description: Manage leaderboard NPCs
    usage: /kmcnpc <create|remove|list> [type] [fancyNpcId]
    permission: kmc.npc.admin

  kmchost:
    description: "The KMC host (presenter NPC): place, test, replay intros, announce"
    usage: /kmchost <info|spawn|setspawn|remove|skin|intro|announce|dialogue|test|skip|enable|disable|reload>
    permission: kmc.host.admin
    aliases: [khost]

  kmcpodium:
    description: "The physical podium of the winner ceremony: set, remove, test"
    usage: /kmcpodium <set|remove|test|info>
    permission: kmc.admin

  kmcchecklist:
    description: "The tournament checklist: everything still to do, to tick off"
    usage: /kmcchecklist [list|add <text>|remove <nr>|toggle <nr>|reset|defaults]
    permission: kmc.admin

  kmc:
    description: "KMC main command: /kmc host ..."
    usage: /kmc host <info|spawn|setspawn|intro|announce|test|skip|reload>
    permission: kmc.host.admin

  kmcround:
    description: Manage tournament rounds
    usage: /kmcround <set|next|info> [round]
    permission: kmc.round.admin

  kmcpoints:
    description: Manage team and player points
    usage: /kmcpoints <set|add|remove> <team|player> <n> <amount>
    permission: kmc.points.admin

  tc:
    description: Team chat
    usage: /tc [message]
    permission: kmc.teamchat

  kmcvote:
    description: Vote for the next game (opens GUI)
    usage: /kmcvote [open|<number>]
    permission: kmc.vote

  kmcauto:
    description: Control the automation engine
    usage: /kmcauto <start|stop|skip|pause|resume|status|endgame|schedule|preset|games|time|rerun|dryrun|finale|director>
    permission: kmc.automation.admin

  pause:
    description: "Pause the tournament (between games now, during a game right after it). /pause now = emergency freeze"
    usage: /pause [now|cancel]
    permission: kmc.automation.admin
    aliases: [kmcpause]

  resume:
    description: Resume a paused tournament / lift the emergency freeze
    usage: /resume
    permission: kmc.automation.admin
    aliases: [kmcresume]

  kmcdirector:
    description: Open the event director panel (skip, pause, rerun, finale, presets)
    usage: /kmcdirector
    permission: kmc.automation.admin
    aliases: [kmcdir, kmcregie]

  kmcseason:
    description: Season and all-time ranking over all past tournaments
    usage: /kmcseason [season|all]
    aliases: [kmcranking, kmcalltime]

  kmctrack:
    description: Track records and your personal bests (Track Mastery)
    usage: /kmctrack
    aliases: [kmcrecords, kmcbaan]

  gg:
    description: "Say GG after a game (sportsmanship button)"
    usage: /gg

  clip:
    description: "Mark a moment for the editors (/clip <text>), list markers, start the stream clock"
    usage: /clip <text|list|start>

  kmcaudit:
    description: "Safe-teleport audit: which teleports were corrected or unsafe"
    usage: /kmcaudit [clear]
    permission: kmc.audit

  kmcapi:
    description: "Live-data API / stream overlay server"
    usage: /kmcapi <status|start|stop>
    permission: kmc.api.admin

  kmcspec:
    description: "Spectator: teleport menu, follow a player"
    usage: /kmcspec [menu|follow|stop]

  kmchud:
    description: "Sidebar density: normal, compact or minimal"
    usage: /kmchud [normal|compact|minimal]

  kmcemblem:
    description: "Get or wear your team banner"
    usage: /kmcemblem [give|wear|<team>]

  teamprofile:
    description: "Team profile: emblem, rank, best game, members"
    usage: /teamprofile [team]
    aliases: [kmcteaminfo, teaminfo]

  ttt:
    description: "Play tic-tac-toe against another player in the lobby"
    usage: /ttt <player|accept|decline|stop>
    aliases: [tictactoe]

  lobbyspleef:
    description: "Join the lobby spleef queue"
    usage: /lobbyspleef
    aliases: [lspleef]

  darts:
    description: "Get five darts to throw at the target blocks in the lobby"
    usage: /darts

  lobbygames:
    description: "Lobby minigames: leaderboards and dartboard setup"
    usage: /lobbygames <top [ttt|darts|fish]|board add|board clear|board list>
    aliases: [lg]

  kmcfeedback:
    description: Rate the tournament (1-5 stars) with an optional comment
    usage: /kmcfeedback <1-5> [comment]

  kmcarena:
    description: Manage game arenas
    usage: /kmcarena <setorigin|setteamspawn|addsolospawn|status|paste|reset> [args...]
    permission: kmc.arena.admin

  kmclobby:
    description: Lobby teleport and setup
    usage: /kmclobby [set|tp|tpall]
    permission: kmc.lobby

  kmcrandomteams:
    description: Randomly distribute online players across teams
    usage: /kmcrandomteams [all|new] [confirm]
    permission: kmc.team.admin

  kmchof:
    description: View the KMC Hall of Fame (all-time best players)
    usage: /kmchof [page]
    permission: kmc.hof

  kmcprefs:
    description: Manage your personal preferences (sounds, particles, scoreboard, etc.)
    usage: /kmcprefs <list|set|reset> [key] [value]
    permission: kmc.prefs

  kmchealth:
    description: View KMC plugin health diagnostics (admin)
    usage: /kmchealth [history|tps|now]
    permission: kmc.health.admin

  kmcready:
    description: "Say your team is ready (ready check). Admins: force / status"
    usage: /kmcready
    permission: kmc.ready

  kmcmap:
    description: Manage map rotation for arenas (admin)
    usage: /kmcmap <list|next|set|reload> [game] [mapName]
    permission: kmc.map.admin

  kmclobbynpc:
    description: Manage decorative lobby NPCs (admin)
    usage: /kmclobbynpc <spawn|rank|list|despawnall> [...]
    permission: kmc.lobbynpc.admin

  event:
    description: Tournament simulation and rollback tools
    usage: /event <simulate|snapshot|rollback|listsnapshots> [args...]
    permission: kmc.event.admin

  kmcachievements:
    description: Shows where your achievements are (advancement screen); admins can manage them
    usage: /kmcachievements [list|progress|grant|revoke|reset|reload|info] [player] [id]

  kmcceremonies:
    description: Edit ceremony messages, titles and durations in-game
    usage: /kmcceremonies <list|info|duration|title|subtitle|addmsg|setmsg|delmsg|clearmsg|reload> [phase] [args]
    permission: kmc.admin

  kmcsetup:
    description: Open the unified Setup Dashboard GUI (lobby + all games)
    usage: /kmcsetup
    permission: kmc.arena.admin

  tutorial:
    description: Open the KMC tutorial hub (how the tournament and its systems work)
    usage: /tutorial
    permission: kmc.stats
    aliases: [kmctutorial]

  kmcprofile:
    description: Open your (or another player's) profile GUI
    usage: /kmcprofile [player]
    permission: kmc.stats

  kmcstandings:
    description: Open the live standings GUI
    usage: /kmcstandings
    permission: kmc.leaderboard

  kmchelp:
    description: Open the help / how-it-works GUI
    usage: /kmchelp
    permission: kmc.stats

  kmcsettings:
    description: Open the settings GUI (admin)
    usage: /kmcsettings
    permission: kmc.admin

  kmclanguage:
    description: Choose your personal language (NL/EN)
    usage: /kmclanguage
    permission: kmc.language
    aliases: [kmclang, taal]

  kmcmedals:
    description: View your medals + the Most Decorated leaderboard
    usage: /kmcmedals
    permission: kmc.medals
    aliases: [medals, medailles]

  kmcmvp:
    description: View game MVPs (this tournament + all-time)
    usage: /kmcmvp
    permission: kmc.medals
    aliases: [mvp]

  kmcmomentum:
    description: View team momentum (biggest rise/fall, hot streaks)
    usage: /kmcmomentum
    permission: kmc.medals
    aliases: [momentum]

  kmcpowerrank:
    description: View team power rankings (ELO)
    usage: /kmcpowerrank
    permission: kmc.medals
    aliases: [powerrank, powerrankings]

  kmcwinner:
    description: Preview or skip the Winner Ceremony 2.0 (admin)
    usage: /kmcwinner [test|skip]
    permission: kmc.tournament.admin

  kmcvalidate:
    description: Open the Event Validation Center (readiness checks)
    usage: /kmcvalidate [test|export]
    permission: kmc.tournament.admin
    aliases: [kmcreadycheck, kmceventcheck, kmcdiagnostics]

  kmcopeningsceremony:
    description: Set up the opening ceremony fireworks per moment
    usage: /kmcopeningsceremony [gui|list|test [moment]|addspot <moment>|clear <moment>]
    permission: kmc.admin
    aliases: [kmcopening, kmcceremonyfx]

  kmccamera:
    description: Record and manage cinematic camera routes
    usage: /kmccamera <list|info|create|addpoint|removepoint|save|discard|preview|delete|reload|stop> [args]
    permission: kmc.camera.admin
    aliases: [kmc-cam, cam]

  kmcpresentation:
    description: Control active cinematic presentations
    usage: /kmcpresentation <start|skip|stop|status|routes|reload> [routeId] [player|all]
    permission: kmc.admin
    aliases: [kmc-pres]

permissions:
  kmc.*:
    description: All KMC permissions
    children:
      kmc.team: true
      kmc.team.admin: true
      kmc.stats: true
      kmc.leaderboard: true
      kmc.teamchat: true
      kmc.vote: true
      kmc.lobby: true
      kmc.tournament.admin: true
      kmc.game.admin: true
      kmc.npc.admin: true
      kmc.host.admin: true
      kmc.round.admin: true
      kmc.points.admin: true
      kmc.automation.admin: true
      kmc.arena.admin: true
      kmc.lobby.admin: true
      kmc.hof: true
      kmc.prefs: true
      kmc.health.admin: true
      kmc.ready: true
      kmc.map.admin: true
      kmc.lobbynpc.admin: true
      kmc.event.admin: true
      kmc.admin: true

  kmc.team:             { description: Basic team commands,    default: true }
  kmc.team.admin:       { description: Manage team assignments, default: op }
  kmc.stats:            { description: View statistics,         default: true }
  kmc.leaderboard:      { description: View leaderboards,       default: true }
  kmc.teamchat:         { description: Use team chat,           default: true }
  kmc.vote:             { description: Vote in game vote,       default: true }
  kmc.lobby:            { description: Use /kmclobby tp,        default: true }
  kmc.lobbygames.admin: { description: Set up lobby dartboards,  default: op }
  kmc.lobby.build:      { description: Build in the lobby (anti-grief exempt), default: op }
  kmc.audit:            { description: View the safe-teleport audit, default: op }
  kmc.api.admin:        { description: Control the live-data API,   default: op }
  kmc.clip.admin:       { description: Reset the clip-marker clock, default: op }
  kmc.tournament.admin: { description: Manage tournament,       default: op }
  kmc.game.admin:       { description: Manage games,            default: op }
  kmc.npc.admin:        { description: Manage NPCs,             default: op }
  kmc.host.admin:       { description: Manage the KMC host (presenter NPC), default: op }
  kmc.round.admin:      { description: Manage rounds,           default: op }
  kmc.points.admin:     { description: Manage points,           default: op }
  kmc.automation.admin: { description: Control automation,      default: op }
  kmc.arena.admin:      { description: Manage arenas,           default: op }
  kmc.lobby.admin:      { description: Set/move lobby,          default: op }
  kmc.hof:              { description: View Hall of Fame,        default: true }
  kmc.prefs:            { description: Manage own preferences,   default: true }
  kmc.language:         { description: Choose your language,     default: true }
  kmc.medals:           { description: View medals,              default: true }
  kmc.health.admin:     { description: View plugin diagnostics,  default: op }
  kmc.ready:            { description: Use /kmcready,            default: true }
  kmc.chat.bypass:      { description: Can chat while the chat is closed for explanations and ceremonies (not even OP has it by default), default: false }
  kmc.map.admin:        { description: Manage map rotation,      default: op }
  kmc.lobbynpc.admin:   { description: Manage decorative NPCs,   default: op }
  kmc.event.admin:      { description: Run simulations and rollbacks, default: op }
  kmc.admin:            { description: Full KMC admin access (achievements etc.), default: op }
  kmc.camera.admin:     { description: Record and manage camera routes, default: op }