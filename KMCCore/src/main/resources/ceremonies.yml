# ============================================================
#   KMC Core - Ceremonie & Fase Configuratie
#
#   Stel in wat er gezegd en getoond wordt, en hoe lang elke
#   toernooifase duurt. Bewerk dit bestand of gebruik
#   /kmcceremonies in-game.
#
#   Ondersteunde placeholders in messages/titles:
#     {tournament_name}  — bijv. "Krizi Minecraft Championship"
#     {round}            — huidig rondenummer
#     {multiplier}       — huidige punten-multiplier (bijv. 1.5)
#     {team_count}       — aantal actieve teams
#     {game_name}        — weergavenaam van de huidige game
#     {game_objective}   — doel van de huidige game (één regel)
#     {winner}           — naam van het winnende team (alleen slotceremonie)
#     {total_rounds}     — totaal aantal rondes van het toernooi
#     {games_per_round}  — aantal games per ronde
#     {game_count}       — aantal beschikbare (ingeschakelde) games
#
#   Kleurcodes: gebruik & gevolgd door de Minecraft-kleurcode.
#   Titels/subtitels ondersteunen ook kleurcodes.
#   Zet title of subtitle op "" om deze niet te tonen.
#
#   De openingspresentatie (/kmcauto start) speelt deze fases af, in volgorde:
#     opening → how-it-works → tournament-overview → team-showcase → game-lineup
#   Overslaan tijdens het testen kan met /kmcauto skip.
# ============================================================

# ── Tempo van de presentatie ──────────────────────────────────────────────────
pacing:
  # Minimaal aantal ticks dat een blok tekst alleen in beeld staat (20 ticks = 1 seconde)
  line-delay-ticks: 40
  # Extra ticks per zichtbaar teken: lange regels krijgen zo meer leestijd (1.3 ≈ 15 tekens/sec)
  ticks-per-char: 1.3
  # Minimale leestijd (ticks) na de laatste regel van een fase, voor de volgende begint
  read-buffer-ticks: 50

# ── Opmaak van de tekst in "messages" ─────────────────────────────────────────
#   • Elke fase krijgt automatisch een kader met titel + subtitel bovenaan en een lijn onderaan.
#     Losse streeplijnen (&8§m ...) in messages worden dus genegeerd.
#   • Lange regels worden automatisch afgebroken en netjes uitgelijnd.
#   • Begin een regel met <c> om hem te centreren.

# ── Openingsceremonie (eenmalig bij start van het toernooi) ───────────────────
opening:
  duration-seconds: 12
  title: "&6&lKMC TOERNOOI"
  subtitle: "&eLaat de spelen beginnen!"
  messages:
    - "<c>&6&lWelkom bij de &e&l{tournament_name}&6&l!"
    - ""
    - "<c>&f{team_count} &7teams  &8•  &f{game_count} &7mini-games  &8•  &f{total_rounds} &7rondes"
    - ""
    - "<c>&7Eerst leggen we rustig uit hoe alles werkt."

# ── Uitleg van het toernooi-format ────────────────────────────────────────────
how-it-works:
  duration-seconds: 10
  title: "&b&lZO WERKT HET"
  subtitle: "&7Even de spelregels"
  messages:
    - " &b&l1. &7Jullie spelen in &fteams&7. Alles wat jij scoort telt mee voor je team."
    - ""
    - " &b&l2. &7Het toernooi heeft &f{total_rounds} rondes&7 van elk &f{games_per_round} mini-games&7."
    - ""
    - " &b&l3. &7Na elke game stemmen jullie &fsamen&7 welke game er daarna komt."
    - ""
    - " &b&l4. &7Punten verdien je met &fplaatsingen&7, &fkills&7 en het halen van &fdoelen&7."
    - ""
    - " &b&l5. &7Elke ronde telt &fzwaarder&7 mee dan de vorige: de punten worden &fvermenigvuldigd&7."
    - ""
    - " &b&l6. &7Het team met de meeste punten na ronde {total_rounds} is &6&lkampioen&7!"
    - ""
    - "<c>&7Elke game krijgt vlak voor de start nog een &feigen uitleg&7."
    - "<c>&8Tip: typ &e/tutorial &8om alles op elk moment terug te lezen."

# ── Team-showcase (toont alle teamnamen) ──────────────────────────────────────
team-showcase:
  duration-seconds: 15
  title: "&b&lTEAM-SHOWCASE"
  subtitle: "&7Leer je tegenstanders kennen"
  messages:
    - "<c>&7Dit zijn de teams die het tegen elkaar opnemen:"
    # Hieronder komt automatisch elk team met zijn spelers.

# ── Toernooi-overzicht (onthulling van de game-line-up) ───────────────────────
tournament-overview:
  duration-seconds: 10
  title: "&d&lRONDES & PUNTEN"
  subtitle: "&7Latere rondes leveren meer op"
  messages:
    - "<c>&7Punten worden elke ronde &fvermenigvuldigd&7 — latere rondes leveren meer op!"
    - ""
    - "<c>&7Nu: ronde &f{round}&7, multiplier &e&l{multiplier}x"
    - ""
    # Hieronder komt automatisch een overzicht van de multiplier per ronde (uit config.yml).

# ── Game-line-up (toont alle games voordat het stemmen begint) ────────────────
game-lineup:
  duration-seconds: 6
  # Hoeveel seconden elke game in de schijnwerpers staat (titel + doel)
  seconds-per-game: 4
  title: "&a&lDE GAMES"
  subtitle: "&7Dit gaan we spelen"
  messages:
    - "<c>&7Alle &f{game_count} &7games, één voor één — met het doel en hoe je punten scoort."
    # Hieronder komt automatisch een kaart per game.

# ── Stemfase ──────────────────────────────────────────────────────────────────
voting:
  duration-seconds: 30    # ook geregeld door automation.voting.duration
  title: "&6&lSTEM NU"
  subtitle: "&eTyp het nummer in de chat"
  messages:
    - "&6&l▸ STEM OP DE VOLGENDE GAME ◂"

# ── Game-intro (getoond voordat elke game start) ──────────────────────────────
game-intro:
  duration-seconds: 15
  title: "&e&l{game_name}"
  subtitle: "&7Maak je klaar!"
  messages:
    - "&e&l▸ {game_name} ◂"
    - "  &7Doel: &f{game_objective}"
    - "  &7Ronde {round} — &e{multiplier}x &7punten"

# ── Game-einde ceremonie (na elke game, voor de volgende stemronde) ───────────
game-end:
  duration-seconds: 10
  title: "&a&lGAME VOLTOOID"
  subtitle: "&7Resultaten worden berekend..."
  messages:
    - "&a&l▸ GAME VOLTOOID ◂"

# ── Ronde-einde ceremonie (nadat alle games in een ronde klaar zijn) ──────────
round-end:
  duration-seconds: 20
  title: "&6&lRONDE {round} VOLTOOID"
  subtitle: "&7Standen hieronder"
  messages:
    - "&6&l▸ EINDE VAN RONDE {round} ◂"
    - "  &7Multiplier volgende ronde: &e{multiplier}x"

# ── Slot- / winnaarsceremonie ─────────────────────────────────────────────────
closing:
  duration-seconds: 40
  title: "&6&l★ TOERNOOI VOLTOOID ★"
  subtitle: "&eGefeliciteerd!"
  messages:
    - "&8§m                                    "
    - "  &6&l★ {tournament_name} — VOLTOOID ★"
    - "  &aGefeliciteerd &6{winner}&a!"
    - "  &7Bedankt allemaal voor het spelen!"
    - "&8§m                                    "
