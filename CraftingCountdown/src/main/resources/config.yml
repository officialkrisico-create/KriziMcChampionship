# ================================================================
# Crafting Countdown — craft it and deliver it
# ================================================================
# One work area per team. Per area, in the same order for all three lists:
#   /craftcountdown area center      where the team stands (a crafting table next to it)
#   /craftcountdown area delivery    the block you LOOK at: right-click it to deliver items
#   /craftcountdown area supply      the chest you LOOK at: it is filled with the raw materials each round
# Then:  /craftcountdown world | validate | start [dry] | stop | reload
# ================================================================

start-flow:
  introduction: true
  flyover: true
  tutorial: true
  countdown: true
start-sequence:
  intro-seconds: 3
  intro-subtitle: "Craft het doel-item en lever het in"
  flyover-radius: 30
  tutorial-seconds: 6
  countdown-seconds: 5

game:
  rounds: 5
  round-seconds: 45
  rest-seconds: 10
  # Difficulty per round (cycles when there are more rounds).
  difficulty-order: [EASY, EASY, MEDIUM, MEDIUM, HARD]
  # When the recipe pool of a difficulty is used up: allow repeats instead of mixing in other difficulties.
  allow-repeat: false
  # Per round: NONE or DOUBLE_RECIPE (two recipes, in order). Cycles.
  modifiers: [NONE, NONE, NONE, DOUBLE_RECIPE, NONE]

points:
  easy: 10
  medium: 25
  hard: 45
  first-delivery: 10
  all-complete: 30
  team-placement: true

# Recipes. resources = what the supply chest gets (raw materials), item/amount = what has to be delivered.
recipes:
  - { id: torches, item: TORCH, amount: 8, difficulty: EASY, resources: { COAL: 2, OAK_PLANKS: 1 } }
  - { id: bread, item: BREAD, amount: 4, difficulty: EASY, resources: { WHEAT: 12 } }
