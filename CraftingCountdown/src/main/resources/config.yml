  - { id: chest, item: CHEST, amount: 1, difficulty: EASY, resources: { OAK_PLANKS: 8 } }
  - { id: bucket, item: BUCKET, amount: 1, difficulty: EASY, resources: { IRON_INGOT: 3 } }
  - { id: shield, item: SHIELD, amount: 1, difficulty: MEDIUM, resources: { OAK_PLANKS: 6, IRON_INGOT: 1 } }
  - { id: dispenser, item: DISPENSER, amount: 1, difficulty: MEDIUM, resources: { COBBLESTONE: 7, STICK: 3, STRING: 3, REDSTONE: 1 } }
  - { id: hopper, item: HOPPER, amount: 1, difficulty: MEDIUM, resources: { IRON_INGOT: 5, OAK_PLANKS: 8 } }
  - { id: piston, item: PISTON, amount: 1, difficulty: MEDIUM, resources: { OAK_PLANKS: 3, COBBLESTONE: 4, IRON_INGOT: 1, REDSTONE: 1 } }
  - { id: observer, item: OBSERVER, amount: 1, difficulty: HARD, resources: { COBBLESTONE: 6, REDSTONE: 2, QUARTZ: 1 } }
