name: CraftingCountdown
version: 1.0.0
main: nl.kmc.crafting.CraftingCountdownPlugin
api-version: '1.21'
authors: [KMC]
depend: [KMCCore, kmc-game-api]
description: Crafting Countdown - craft the target item and deliver it before the time runs out

commands:
  craftcountdown:
    description: Crafting Countdown control + setup
    aliases: [craftingcountdown, cc]
    usage: /craftcountdown <start|stop|status|validate|world|area|reload>
    permission: craftcountdown.admin

permissions:
  craftcountdown.admin:
    description: Crafting Countdown admin commands
    default: op
