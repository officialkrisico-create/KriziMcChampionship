# ================================================================
# Dungeon Draft — draft your own route through a dungeon, room by room
# ================================================================
# Every team runs its own lane; after each room the team votes for the next one from a few options.
# Damage comes off a shared team health pool with revives (health.mode SHARED).
#
# Setup:
#   /dungeon world
#   /dungeon lane add       stand on the origin block of a team's lane (the floor is one block lower).
#                           One lane per team; lane 1 = first team in alphabetical order. The rooms lie
#                           at the 'at' offsets below, the team waits/drafts at dungeon.lobby.
#   /dungeon validate | info | room list|info <id> | start [dry] | stop | reload
# Quick test arena (8 lanes, floors built from the room offsets):  /kmctest dungeon_draft
# Room types: COMBAT (waves), PARKOUR (checkpoints + finish), TRAP (timed hazards + switches),
#             TREASURE (chests, some trapped), PUZZLE (repeat the sequence), BOSS (telegraphed strikes).
# Every position in 'rooms' is an offset from the lane origin ('at') or from the room origin (the rest).

config-version: 1

start-flow:
  introduction: true
  flyover: true
  tutorial: true
  countdown: true
start-sequence:
  intro-seconds: 3
  intro-subtitle: "Kies je route door de dungeon"
  flyover-radius: 30
  tutorial-seconds: 7
  countdown-seconds: 5

dungeon:
  length: 5                  # aantal kamers in een run (laatste is de baas)
  route-choices: 3           # opties per draft
  boss-last: true            # laatste kamer is altijd een BOSS-kamer
  modifier-chance: 0.3       # kans op een extra (DOUBLE_REWARD, REDUCED_TIME, EXTRA_WAVE, HEAL)
  draft-seconds: 20          # tijd om te kiezen
  vote-mode: MAJORITY        # MAJORITY (meeste stemmen) of LEADER (alleen de teamleider kiest)
  fallback: RANDOM           # niemand koos: RANDOM, EASIEST of HARDEST
  duration-seconds: 720      # totale speeltijd; wat dan niet af is, levert niets op
  lobby: [6, 0, 0]           # waar het team wacht en draft, t.o.v. de baan-oorsprong

health:
  mode: SHARED               # SHARED (teampool) of INDIVIDUAL (gewone speler-schade + team-PvP)
  team-health: 100
  revives: 1                 # extra levens voor het team; daarna faalt de run
  damage-factor: 2.5         # 1 hartje (2 schade) van een mob = 5 teamgezondheid
  timeout-damage: 15         # teamschade als een kamer niet binnen de tijd af is
  void-damage: 5             # teamschade als iemand in de void valt (hij wordt teruggezet)

shop:                        # uitgeven aan het draft-menu, verdiend met kisten en kamers
  heal-cost: 30
  heal-amount: 30
  revive-cost: 60

points:
  fast-bonus-percent: 15     # klaar met >= helft van de tijd over
  boss-bonus: 100
  run-complete: 100          # alle kamers gehaald
  health-bonus: 50           # maximaal, naar rato van de overgebleven teamgezondheid
  death-penalty-percent: 10  # alleen in INDIVIDUAL-modus, per dood

rooms:
  - id: armory
    name: "Wapenkamer"
    description: "Een paar zombies bewaken de oude wapens."
    type: COMBAT
    difficulty: 1
    reward: 100
    time-limit-seconds: 90
    risk: "Laag"
    at: [14, 0, 0]
    entry: [1, 0, 0]
    spawns: [[10, 0, -3], [10, 0, 3], [11, 0, 0]]
    max-active: 5
    wave-delay-seconds: 4
    health-scale: 1.0
    waves:
      - {ZOMBIE: 3}
      - {ZOMBIE: 3, SKELETON: 1}

  - id: bridge
    name: "Gebroken brug"
    description: "Spring over de stenen; vallen kost teamgezondheid."
    type: PARKOUR
    difficulty: 1
    reward: 100
    time-limit-seconds: 80
    risk: "Laag"
    at: [28, 0, 0]
    entry: [1, 0, 0]
    checkpoints: [[4, 0, 0], [8, 0, 0]]
    finish-min: [11, 0, -1]
    finish-max: [12, 0, 1]
