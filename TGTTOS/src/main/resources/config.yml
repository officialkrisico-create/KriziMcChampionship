# ================================================================
# TGTTOS — Configuration
# ================================================================
# Multi-round race minigame. Each round picks one map from the pool;
# players race from start to a finish region. Falling below a map's
# configured void-y respawns them at their last checkpoint (or a start
# spawn if they haven't reached one yet) — no elimination, no lost time
# is charged beyond the fall itself (the race timer keeps running).
#
# Per map, set up via /tgttos editmap <id> ...:
#   - finishpos1 / finishpos2  (required)
#   - addspawn                 (required, × number of player slots)
#   - addcheckpoint             (optional, any number, in order)
#   - voidy <y>                 (optional — leave unset to disable void-fall respawn entirely)

game:
  # One TGTTOS game = this many maps, played in sequence (Map 1..5).
  # Points accumulate across all maps; final standings are calculated only
  # after the last map, and KMC points are awarded once at that point.
  maps-per-game: 5

  # Dynamic map finish: once this % of the field has crossed the finish line,
  # a countdown starts for the remaining racers.
  finish-threshold-percent: 50

  # Length of that countdown (seconds). 120 = "2 minutes to finish".
  finish-countdown-seconds: 120

  # Safety cap: if NOBODY hits the 50% threshold, force the countdown after
  # this many seconds of racing so a map can never stall forever. 0 disables.
  max-map-seconds: 300

  # Pre-game countdown
  countdown-seconds: 10

  # Time between maps (seconds)
  intermission-seconds: 8

  # Chance (0-1) that a map rolls "Fog of War": refreshed short Blindness
  # for every still-racing player, so you only make out what's right in
  # front of you. Set to 0 to disable.
  fog-of-war-chance: 0.15

  # Whoever is currently furthest from the finish gets a brief Speed II,
  # recalculated every second (never sticks to someone who caught up).
  # Only kicks in with 3+ players still racing. Set to false to disable.
  rubber-banding: true

points:
  # Per-round placement (top 5 explicitly specified; 6th+ get "default").
  # These are the actual internal map-score points — read live by the game.
  round-placement:
    1: 80
    2: 70
    3: 65
    4: 60
    5: 55
    "default": 0

  # When a TEAM finishes (all members racing this map have crossed the
  # finish line), every member gets this bonus — keyed by which team was
  # Nth to fully finish the round, not by placement of individual players.
  # Only applies to players on a KMC tournament team; solo/unteamed players
  # are unaffected. 1st team = 25 each, 2nd = 20, 3rd = 15, 4th = 10, 5th = 5, 6+ = 0.
  team-finish-bonus:
    1: 25
    2: 20
    3: 15
    4: 10
    5:  5
    "default": 0

  # Final per-game placement bonuses (kept for tournament integration).
  first-place: 250
  second-place: 150
  third-place: 100
  participation: 25

# Maps (set via /tgttos commands)
maps: {}
