name: kmc-game-api
version: '1.0.0'
main: nl.kmc.game.api.GameApiPlugin
api-version: '1.21'
description: KMC Game API — shared base classes for all KMC mini-game plugins
authors: [ KMC ]

depend:
  - KMCCoreV2

commands:
  kmctest:
    description: Generate a throw-away test arena for a game (no map needed)
    usage: /kmctest <game|all|list>
    permission: kmc.admin
  kmcbot:
    description: Add/remove test players (bots) for testing alone
    usage: /kmcbot <add|remove|list|here>
    permission: kmc.admin
