# ================================================================
# Crown Control — several crowns, carried and stolen
# ================================================================
# Setup:
#   /crown world
#   /crown pos1 + pos2, then /crown zone        the area where the crowns lie (give it some height)
#   /crown spawn add                            spawns; team N respawns on spawn N (alphabetical team id)
#   /crown pos1 + pos2, then /crown lockdown add <id>   (optional) areas that Lockdown closes for the others
#   /crown validate | start [dry] | stop
# Players open the ability menu with the nether star (slot 9) or /crown use.
# ================================================================

start-flow:
  introduction: true
  flyover: true
  tutorial: true
  countdown: true
start-sequence:
  intro-seconds: 3
  intro-subtitle: "Pak de kroon en houd hem vast"
  flyover-radius: 30
  tutorial-seconds: 6
  countdown-seconds: 5

game:
  duration-seconds: 180
  # Every carrier is paid this often.
  score-interval-seconds: 10

# Several crowns lie in the zone. Pick one up by walking over it; an enemy takes it by hitting the carrier
# hits-to-steal times or by knocking him out.
crowns:
  count: 3
  pickup-radius: 1.8
  hits-to-steal: 3
  drop-delay-ticks: 30

points:
  hold: 10            # per carrier, per score interval
  steal: 15           # for taking a crown from a carrier
  end-bonus: 50       # split over the carriers of the team that wears the most crowns at the end
  team-placement: true

# Team energy (game data, NOT coins): spent on abilities by the team that holds the crown.
energy:
  capacity: 100
  per-hold: 10
  per-steal: 10

abilities:
  double-down: { cost: 20, seconds: 15, multiplier: 2.0, cooldown: 20 }
  lockdown:    { cost: 30, seconds: 10, cooldown: 25 }
  overdrive:   { cost: 25, seconds: 10, cooldown: 20, speed-level: 2 }
  bounty:      { cost: 30, seconds: 30, cooldown: 30, bonus: 15 }
  fortify:     { cost: 25, seconds: 10, cooldown: 20 }

combat:
  respawn-seconds: 5
  spawn-protection-seconds: 3
  friendly-fire: false

kit:
  team-armor: true
  items:
    - STONE_SWORD:1
    - BOW:1
    - ARROW:16
    - COOKED_BEEF:8
    - GOLDEN_APPLE:1

arena:
  world: ""
